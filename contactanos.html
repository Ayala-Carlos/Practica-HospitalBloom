<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header></header>

    <section class="seccion-contacto-hospital">
    <div class="f-hosp-contenedor">
        <h2 class="f-hosp-titulo">Contáctanos</h2>
        <form class="f-hosp-formulario">
            <div class="f-hosp-grupo">
                <label class="f-hosp-label">Nombre Completo</label>
                <input type="text" class="f-hosp-input" placeholder="Tu nombre">
            </div>
            <div class="f-hosp-grupo">
                <label class="f-hosp-label">Email</label>
                <input type="email" class="f-hosp-input" placeholder="correo@ejemplo.com">
            </div>
            <div class="f-hosp-grupo">
                <label class="f-hosp-label">Mensaje</label>
                <textarea class="f-hosp-textarea" rows="4"></textarea>
            </div>
            <button type="submit" class="f-hosp-btn">Enviar Mensaje</button>
        </form>
    </div>
</section>


  <footer>
        <div class="container">
            <p>&copy; 2024 Hospital de Niños Benjamín Bloom. Todos los derechos reservados.</p>
            <p>San Salvador, El Salvador</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <script src="main.js"></script>
</body>
</html>
